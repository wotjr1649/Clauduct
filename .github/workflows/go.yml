name: go

# The public checks cover synthetic protocol contracts (#271) and argv dispatch (#331).
# The private suite, race run, evidence checks and their inputs stay off the public tree.

on:
  push:
    branches: [main, 'redesign/**']
    paths:
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/**'
      - '.github/tests/native_dispatch_test.go'
      - '.github/tests/staticcheck-baseline.txt'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - '.gitattributes'
      - 'scripts/**'
      - '.github/tests/native_dispatch_test.go'
      - '.github/tests/staticcheck-baseline.txt'
      - '.github/workflows/go.yml'

defaults:
  run:
    working-directory: go

jobs:
  go:
    # Windows because the product is Windows-only today: internal/platform has a
    # windows-tagged file and no other, so this module does not build elsewhere. That is
    # deliberate — a non-Windows target is new design under V2-04, not a port.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: go
    timeout-minutes: 20
    env:
      # Pinned rather than left to the runner. CGO_ENABLED defaults to 1 wherever a C
      # toolchain exists and windows-latest has one, so without this CI would build
      # different bytes than a release machine without gcc.
      CGO_ENABLED: '0'
      # The installed Go is the policy toolchain (#380): never switch to another one on demand.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # The root go.mod is the only place the Go version is declared (#370; the harness and the
          # release build read its toolchain line, else its go line, #380). Raising it is a decision,
          # so a toolchain change cannot arrive unnoticed the way `latest` would.
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count) {
            $unformatted
            exit 1
          }

      - name: PowerShell scripts
        run: |
          $PSVersionTable.PSVersion
          foreach ($file in Get-ChildItem ../scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors; exit 1 }
            if ($ast.ScriptRequirements.RequiredPSVersion.Major -ne 7) {
              throw "$($file.Name) must require PowerShell 7"
            }
          }

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: Install Go analyzers
        run: |
          $env:GOBIN = $env:RUNNER_TEMP
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          exit $LASTEXITCODE

      - name: govulncheck
        run: '& "$env:RUNNER_TEMP/govulncheck.exe" ./...'

      - name: Staticcheck
        run: |
          $diagnostics = & "$env:RUNNER_TEMP/staticcheck.exe" -f json -fail= -checks 'SA*,U1000' ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $baseline = [Collections.Generic.List[string]]::new()
          $baseline.AddRange([string[]]@(Get-Content -LiteralPath ../.github/tests/staticcheck-baseline.txt))
          $failed = $false
          foreach ($record in $diagnostics) {
            $finding = ConvertFrom-Json -InputObject $record
            $location = $finding.location
            $path = [IO.Path]::GetRelativePath($PWD.Path, $location.file).Replace('\', '/')
            # Ignore line shifts and consume one baseline entry per occurrence.
            if ($baseline.Remove("${path} $($finding.code) $($finding.message)")) { continue }
            Write-Output "${path}:$($location.line):$($location.column): $($finding.message) ($($finding.code))"
            $failed = $true
          }
          if ($failed) { exit 1 }

      # The public contract tests (#271).
      - name: contract tests
        run: |
          $out = go test -count=1 ./internal/protocol/anthropic ./internal/protocol/bridge ./internal/protocol/codex ./internal/stream ./internal/wire 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { exit $code }
          if ($out -match 'no test files') { Write-Error 'a contract-test package has no test files'; exit 1 }

      - name: native argv contract
        run: |
          $testPath = Join-Path $PWD 'internal/app/native_dispatch_public_test.go'
          $source = (Resolve-Path ../.github/tests/native_dispatch_test.go).Path
          $overlay = Join-Path $env:RUNNER_TEMP 'native-dispatch-overlay.json'
          @{ Replace = @{ $testPath = $source } } | ConvertTo-Json | Set-Content -LiteralPath $overlay
          $out = go test -v -count=1 "-overlay=$overlay" -run '^TestNativeConservativeDispatchContract$' ./internal/app 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { exit $code }
          if (-not ($out -match '^--- PASS: TestNativeConservativeDispatchContract ')) {
            Write-Error 'the native argv contract test was not loaded'; exit 1
          }

  httpguard-portable:
    # This compiles the shared filter only; the full launcher remains Windows-only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: shared filter
        run: go build ./internal/httpguard
