name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows-only for now: the verification harness uses PowerShell scripts and
    # fixed Windows fixture paths. Product code under src/ is already portable.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run test suite
        # bash so the glob expands; --test-concurrency=1 matches run-node-tests.ps1.
        # That runner also creates .tmp before starting, and fixtures mkdtemp into
        # it without creating it themselves, so prepare it here too.
        shell: bash
        run: |
          mkdir -p .tmp
          node --test --test-concurrency=1 src/test-*.mjs
