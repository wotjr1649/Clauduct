name: go

# Compile-only since v0.3.3. Tests, the race run, evidence checks and their inputs are not in
# the public tree; the maintainer runs them locally before a push. A `go test` here would
# report "no test files" and read as a pass, so this workflow does not run one.

on:
  push:
    branches: [main, 'redesign/**']
    paths:
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go.yml'

defaults:
  run:
    working-directory: go

jobs:
  go:
    # Windows because the product is Windows-only today: internal/platform has a
    # windows-tagged file and no other, so this module does not build elsewhere. That is
    # deliberate — a non-Windows target is new design under V2-04, not a port.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Pinned rather than left to the runner. CGO_ENABLED defaults to 1 wherever a C
      # toolchain exists and windows-latest has one, so without this CI would build
      # different bytes than a release machine without gcc.
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Pinned to the version the work was done on. `latest` would let a toolchain
          # change arrive without anyone deciding to take it.
          go-version: '1.27.1'
          cache: false

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

  httpguard-portable:
    # This compiles the shared filter only; the full launcher remains Windows-only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: shared filter
        run: go build ./internal/httpguard
