name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows-only for now: the verification harness uses PowerShell scripts and
    # fixed Windows fixture paths. Product code under src/ is already portable.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run test suite
        # bash so the glob expands; --test-concurrency=1 matches run-node-tests.ps1.
        # .tmp is deliberately not pre-created here: fixtures create it themselves
        # via verification/temporary-dir.mjs, and this run proves it.
        shell: bash
        run: node --test --test-concurrency=1 src/test-*.mjs
