name: go

# A separate workflow file rather than another job inside tests.yml. The Node baseline's
# workflow is the evidence for the shipped product, and a Go failure must not be readable
# as a Node regression. Keeping them apart also means this file can be added without
# editing a tracked file the comparison depends on.

on:
  push:
    branches: [main, 'redesign/**']
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'

defaults:
  run:
    working-directory: go

jobs:
  go:
    # Windows because the product is Windows-only today: internal/platform has a
    # windows-tagged file and no other, so this module does not build elsewhere. That is
    # deliberate — a non-Windows target is new design under V2-04, not a port.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Pinned rather than left to the runner. CGO_ENABLED defaults to 1 wherever a C
      # toolchain exists and windows-latest has one, so without this CI would build and
      # test different bytes than a release machine without gcc -- and the reproducibility
      # test could not tell, because it compares two builds from the same environment.
      # The race job below is the one exception and its binary is not the one that ships.
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Pinned to the version the work was done on. `latest` would let a toolchain
          # change arrive without anyone deciding to take it.
          go-version: '1.27.1'
          cache: false

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: evidence compile and vet
        run: |
          go vet -tags runtime_evidence ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags policy_evidence ./...

      - name: offline evidence validators
        run: go test -tags runtime_evidence -count=1 -timeout=60s -run '^(TestTUIAcceptanceRejectsMissingOrMisorderedEvidence|TestIntegrationAuditSignalsOnlyTextStart|TestIntegrationPrivatePathsStopBeforeTransport)$' ./internal/app

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...

      - name: test (race)
        # The race detector needs cgo and a C toolchain. If this step fails because the
        # runner has neither, fix the runner: an unrun race check is NOT_RUN, never a pass.
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -race ./...

  httpguard-portable:
    # This validates the shared filter only; the full launcher remains Windows-only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: shared filter
        run: go test -count=1 -timeout=60s ./internal/httpguard
