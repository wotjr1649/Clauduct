name: tests

on:
  # push fired on every branch and pull_request fired again for the same commit, so every push
  # to a branch under review ran the whole suite twice, at once, against identical trees. A pull
  # request is judged on its pull_request run, and main is the only ref that still needs a push
  # run of its own. A branch with no pull request open is no longer built; opening one builds it.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows-only for now: the verification harness uses PowerShell scripts and
    # fixed Windows fixture paths. Product code under src/ is already portable.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Node tests (test runner)
        # bash so the glob expands; --test-concurrency=1 matches run-node-tests.ps1.
        # .tmp is deliberately not pre-created: fixtures create it themselves via
        # verification/temporary-dir.mjs, and this run proves it.
        shell: bash
        run: node --test --test-concurrency=1 src/test-*.mjs

      - name: Node tests (standalone)
        # These refuse to run under a populated execArgv (DEBUG_RUNTIME_UNSUPPORTED),
        # so the test runner cannot host them. Run each directly instead.
        if: always()
        shell: bash
        run: |
          status=0
          for file in verification/test-*.mjs poc/test-*.mjs; do
            # read_extra_normal fails here but not locally: resourcesClosed is false
            # when the extra mode posts during shutdown. Which of its nine conditions
            # is false is unrecorded, so the cause is open. See
            # docs/verification-modes-2026-09-14.md before re-enabling.
            if [ "$file" = "poc/test-claude-read-once.mjs" ]; then
              echo "--- $file (excluded: open CI-only failure)"
              continue
            fi
            echo "--- $file"
            node "$file" || status=1
          done
          exit $status

      - name: PowerShell tests
        # A .ps1 that never calls exit leaves $LASTEXITCODE at its previous value,
        # so reset it per test and treat a throw as the failure it is.
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = @()
          foreach ($test in Get-ChildItem -Path src, verification -Filter 'test-*.ps1' | Sort-Object FullName) {
            Write-Host "--- $($test.Name)"
            $global:LASTEXITCODE = 0
            try { & $test.FullName } catch { $failed += $test.Name; continue }
            if ($LASTEXITCODE -ne 0) { $failed += $test.Name }
          }
          if ($failed.Count -gt 0) { throw ("PowerShell tests failed: " + ($failed -join ', ')) }
